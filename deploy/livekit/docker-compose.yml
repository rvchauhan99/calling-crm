services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:v0.1.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./sip-config.yaml:/etc/sip-config.yaml:ro
    command: ["--config", "/etc/sip-config.yaml"]
    depends_on:
      - livekit
      - redis
